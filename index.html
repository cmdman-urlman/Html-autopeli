```html
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>3D Autopeli</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #333;
    font-family: sans-serif;
    user-select: none;
  }
  #game {
    position: relative;
    margin: auto;
    background: #555;
    width: 300px;
    height: 500px;
    border: 4px solid #111;
    overflow: hidden;
    perspective: 800px;
  }
  .road {
    position: absolute;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      #555 0px, #555 40px,
      #666 40px, #666 80px
    );
  }
  /* Pelaajan auto */
  .car {
    position: absolute;
    width: 40px;
    height: 60px;
    bottom: 20px;
    border-radius: 5px;
    background: linear-gradient(to bottom, red, darkred);
    box-shadow: 0 3px 6px black;
    transform-style: preserve-3d;
  }
  .car::before { /* Ikkuna */
    content: "";
    position: absolute;
    width: 30px;
    height: 20px;
    background: lightblue;
    top: 5px;
    left: 5px;
    border-radius: 3px;
    transform: translateZ(5px);
  }
  .car::after { /* Etuvalo */
    content: "";
    position: absolute;
    width: 10px;
    height: 5px;
    background: yellow;
    bottom: 5px;
    left: 15px;
    border-radius: 2px;
    transform: translateZ(5px);
  }
  /* Pyörät */
  .wheel {
    position: absolute;
    width: 10px;
    height: 20px;
    background: black;
    border-radius: 50%;
    transform-origin: center;
  }
  .front-left { top: 5px; left: -5px; }
  .front-right { top: 5px; right: -5px; }
  .back-left { bottom: 5px; left: -5px; }
  .back-right { bottom: 5px; right: -5px; }

  /* Vihollisauto */
  .enemy {
    position: absolute;
    width: 40px;
    height: 60px;
    border-radius: 5px;
    background: linear-gradient(to bottom, blue, darkblue);
    box-shadow: 0 3px 6px black;
    transform-style: preserve-3d;
  }
  .enemy::before { content:""; position:absolute; width:30px; height:20px; background:lightblue; top:5px; left:5px; border-radius:3px; transform:translateZ(5px);}
  .enemy::after { content:""; position:absolute; width:10px; height:5px; background:yellow; bottom:5px; left:15px; border-radius:2px; transform:translateZ(5px);}
  .enemy .wheel { width:10px; height:20px; background:black; border-radius:50%; }

  /* Este */
  .obstacle {
    position: absolute;
    width: 40px;
    height: 40px;
    background: gray;
    top: -40px;
    border-radius: 5px;
    box-shadow: inset 0 0 5px black;
  }
  /* Pistepallo */
  .point {
    position: absolute;
    width: 20px;
    height: 20px;
    background: gold;
    border-radius: 50%;
    top: -20px;
    box-shadow: inset 0 0 5px darkorange;
  }

  #hud { color:white; text-align:center; margin-top:5px; font-size:18px; }
  #controls { text-align:center; margin-top:10px; }
  .btn { display:inline-block; width:80px; height:40px; margin:5px; background:#222; color:white; line-height:40px; border-radius:5px; font-size:20px; user-select:none; }
  .btn:active { background:#444; }
</style>
</head>
<body>
<div id="hud">Pisteet: 0 | Elämät: 3</div>
<div id="game">
  <div class="road"></div>
  <div id="player" class="car">
    <div class="wheel front-left"></div>
    <div class="wheel front-right"></div>
    <div class="wheel back-left"></div>
    <div class="wheel back-right"></div>
  </div>
</div>
<div id="controls">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
</div>

<!-- Äänet -->
<audio id="hitSound" src="https://freesound.org/data/previews/151/151022_2637665-lq.mp3"></audio>
<audio id="pointSound" src="https://freesound.org/data/previews/342/342756_3235320-lq.mp3"></audio>
<audio id="gameOverSound" src="https://freesound.org/data/previews/198/198841_285997-lq.mp3"></audio>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const hud = document.getElementById("hud");
const hitSound = document.getElementById("hitSound");
const pointSound = document.getElementById("pointSound");
const gameOverSound = document.getElementById("gameOverSound");

let lives = 3;
let points = 0;
let speed = 3;
let gameOver = false;

let playerX = 130;
const lanes = [50, 130, 210];

document.addEventListener("keydown", e => { if(e.key==="ArrowLeft") moveLeft(); if(e.key==="ArrowRight") moveRight(); });
document.getElementById("left").addEventListener("click", moveLeft);
document.getElementById("right").addEventListener("click", moveRight);

function moveLeft() { if(gameOver) return; let i=lanes.indexOf(playerX); if(i>0) playerX=lanes[i-1]; }
function moveRight(){ if(gameOver) return; let i=lanes.indexOf(playerX); if(i<lanes.length-1) playerX=lanes[i+1]; }

function spawn(type){
  let elem=document.createElement("div");
  let lane=lanes[Math.floor(Math.random()*lanes.length)];
  if(type==="enemy"){ elem.className="enemy"; elem.style.left=lane+"px"; elem.style.top="-60px"; }
  else if(type==="obstacle"){ elem.className="obstacle"; elem.style.left=lane+"px"; elem.style.top="-40px"; }
  else if(type==="point"){ elem.className="point"; elem.style.left=lane+10+"px"; elem.style.top="-20px"; }
  game.appendChild(elem);
}

function checkCollision(a,b){
  let ar=a.getBoundingClientRect();
  let br=b.getBoundingClientRect();
  return !(ar.right<br.left || ar.left>br.right || ar.bottom<br.top || ar.top>br.bottom);
}

function update(){
  if(gameOver) return;
  player.style.left=playerX+"px";
  let elems=Array.from(game.querySelectorAll(".enemy,.obstacle,.point"));
  elems.forEach((e,index)=>{
    let top=parseInt(e.style.top)||0;
    top+=speed;
    e.style.top=top+"px";
    if(checkCollision(player,e)){
      if(e.classList.contains("enemy")){ lives--; hitSound.play(); e.remove(); if(lives<=0) endGame(); }
      else if(e.classList.contains("obstacle")){ hitSound.play(); endGame(); }
      else if(e.classList.contains("point")){ points++; pointSound.play(); e.remove(); }
    }else if(top>500){ if(e.classList.contains("enemy")) points++; e.remove(); }
  });
  hud.textContent="Pisteet: "+points+" | Elämät: "+lives;
  requestAnimationFrame(update);
}

function endGame(){ gameOver=true; hud.textContent+=" | Peli ohi!"; gameOverSound.play(); }

setInterval(()=>{ if(!gameOver){ let r=Math.random(); if(r<0.5) spawn("enemy"); else if(r<0.7) spawn("obstacle"); else spawn("point"); } },1500);

update();
</script>
</body>
</html>
